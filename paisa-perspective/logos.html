<!doctype html><html><head><meta charset="utf-8"><style>

</style></head><body>
<!-- A: coin in perspective -->

  </g>

</svg>
<!-- B: extruded pp -->
<svg id="b" width="1080" height="1080" viewBox="0 0 1080 1080">

 <g id="ext"></g>
 <text id="front" x="490" y="400" font-size="560" fill="#16161A" text-anchor="middle" dominant-baseline="central" letter-spacing="-30">pp</text>
</svg>

 <path d="M214 540 C214 300 360 222 540 222 C720 222 866 300 866 540 C800 470 760 455 720 452 C700 420 690 410 670 405 C640 440 560 450 470 445 C400 440 330 450 214 540 Z" fill="#231A26" stroke="#141018" stroke-width="20" stroke-linejoin="round"/>
 <ellipse cx="440" cy="580" rx="30" ry="40" fill="#141018"/>

 </g>
</svg>
<script>
const ext=document.getElementById('ext'), N=70;
for(let i=N;i>0;i--){const t=document.createElementNS('http://www.w3.org/2000/svg','text');
 const k=i/N; t.setAttribute("x",490+70*k); t.setAttribute("y",400+70*k);
 t.setAttribute('font-size',560); t.setAttribute('text-anchor','middle'); t.setAttribute('dominant-baseline','central');
 t.setAttribute('letter-spacing','-30'); t.setAttribute('fill', i<3? '#E2552D' : (i%2? '#C8401C':'#C8401C'));
 t.textContent='pp'; ext.appendChild(t);}
</script></body></html>
